<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FixThisInjustice — 24-Week Plan, Three Directions</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
iframe.proto { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.tag { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
  color: rgba(60,50,40,.7); }
.standalone-link { display: inline-block; margin-left: 10px; font-size: 11px;
  color: #c96442; text-decoration: none; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.standalone-link:hover { text-decoration: underline; }
.intro { padding: 6px 10px 8px; font-size: 12px; color: rgba(60,50,40,.65);
  font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.5; }
.intro b { color: rgba(40,30,20,.85); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
function ProtoFrame({ src }) {
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <iframe className="proto" src={src} title={src}></iframe>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas
      title="FixThisInjustice"
      subtitle="24-week reconditioning plan — three visual directions, same prototype state">
      <DCSection
        id="desktop"
        title="Three directions · desktop"
        subtitle="Each artboard is a live, interactive prototype. Logged data (week, day, exercise checks, weight, push-ups) is shared across all three — change one, see it in the others. Click the focus icon on any artboard to view it fullscreen.">
        <DCArtboard id="protocol" label="01 · Protocol — clinical / scientific paper" width={1280} height={1080}>
          <ProtoFrame src="prototype-protocol.html" />
        </DCArtboard>
        <DCArtboard id="almanac" label="02 · Almanac — editorial / training journal" width={1280} height={1080}>
          <ProtoFrame src="prototype-almanac.html" />
        </DCArtboard>
        <DCArtboard id="console" label="03 · Console — operations terminal" width={1280} height={1080}>
          <ProtoFrame src="prototype-console.html" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="mobile"
        title="Same three, mobile"
        subtitle="The prototype is fully responsive — these artboards demonstrate the phone layout. Drop into focus mode for a full-height view.">
        <DCArtboard id="protocol-m" label="01 · Protocol" width={390} height={844}>
          <ProtoFrame src="prototype-protocol.html" />
        </DCArtboard>
        <DCArtboard id="almanac-m" label="02 · Almanac" width={390} height={844}>
          <ProtoFrame src="prototype-almanac.html" />
        </DCArtboard>
        <DCArtboard id="console-m" label="03 · Console" width={390} height={844}>
          <ProtoFrame src="prototype-console.html" />
        </DCArtboard>
      </DCSection>

      <DCPostIt x={40} y={40}>
        Three directions, identical data model. Pick one — or mix the parts you like across them. Tweaks panel inside each (toolbar toggle) lets you swap accent colors and one or two style switches per direction.
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
