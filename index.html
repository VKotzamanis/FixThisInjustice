<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FTI · Console — daily companion</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#00ff88" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Console" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script>
  // Register the service worker for offline support.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0b0c; --bg-2:#13161a; --bg-3:#1c2026; --bg-4:#252a32;
  --line:rgba(220,230,240,.08); --line-2:rgba(220,230,240,.16);
  --text:#dde3ea; --text-2:#8e97a3; --text-3:#5a6270;
  --accent:#a3e635; --accent-d:#84cc16;
  --warn:#fbbf24; --danger:#f87171; --info:#67e8f9;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Geist",-apple-system,system-ui,sans-serif;
  --chart-line:rgba(220,230,240,.3);
  --chart-actual:var(--accent);
  --chart-grid:rgba(220,230,240,.08);
  --chart-text:rgba(220,230,240,.5);
  --chart-marker:var(--accent);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);min-height:100%}
body{font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}

/* CRT layers */
.crt{position:relative;min-height:100vh}
.crt.sc::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background-image:linear-gradient(rgba(255,255,255,.022) 50%,transparent 50%);
  background-size:100% 3px}
.crt.sc::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
@keyframes flick{0%,100%{opacity:1}3%{opacity:.96}5%{opacity:1}88%{opacity:.985}}
.crt.fl{animation:flick 7s infinite}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;background:rgba(10,11,12,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);font-size:11px;color:var(--text-2);letter-spacing:.04em}
.topbar .tl,.topbar .tr{display:flex;align-items:center;gap:14px}
.topbar .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;
  box-shadow:0 0 8px var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar .brand{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--text)}
.topbar .brand .acc{color:var(--accent);margin:0 2px}
.day-ind{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.day-ind b{color:var(--text);font-weight:600;font-family:var(--sans);font-size:13px}
.day-ind .key{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-right:1px}
.day-ind .muted{color:var(--text-3)}
.streak{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
.todaybtn{font:inherit;padding:4px 10px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);cursor:pointer;letter-spacing:.08em;border-radius:0}
.todaybtn:hover{background:var(--accent);color:#0a0b0c}
.todaybtn:disabled{opacity:.3;cursor:not-allowed;border-color:var(--text-3);color:var(--text-3)}
.kbd-hint{font-size:10px;padding:2px 6px;border:1px solid var(--line-2);color:var(--text-3);letter-spacing:.06em}

/* Layout: side nav on desktop, bottom on mobile */
.app{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 38px)}
@media(max-width:820px){.app{grid-template-columns:1fr;padding-bottom:64px}}
.nav{position:sticky;top:38px;align-self:start;display:flex;flex-direction:column;
  border-right:1px solid var(--line);padding:18px 0;height:calc(100vh - 38px);background:var(--bg)}
@media(max-width:820px){
  .nav{position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;height:64px;padding:0;
    border-top:1px solid var(--line-2);border-right:0;background:rgba(10,11,12,.95);backdrop-filter:blur(8px);z-index:40}
}
.nav-btn{flex:1;display:flex;align-items:center;gap:10px;background:transparent;border:0;
  border-left:2px solid transparent;padding:11px 18px;font:inherit;color:var(--text-3);cursor:pointer;
  text-align:left;transition:all .12s;font-family:var(--mono);letter-spacing:.06em}
.nav-btn:hover{color:var(--text-2);background:rgba(255,255,255,.02)}
.nav-btn.is-active{color:var(--accent);border-left-color:var(--accent);background:rgba(163,230,53,.04)}
.nav-icon{font-size:14px;width:18px;text-align:center}
.nav-label{flex:1;font-size:11.5px;font-weight:500}
.nav-hot{font-size:9.5px;color:var(--text-3);padding:1px 5px;border:1px solid var(--line);border-radius:2px}
.nav-btn.is-active .nav-hot{border-color:var(--accent);color:var(--accent)}
@media(max-width:820px){
  .nav-btn{flex-direction:column;gap:2px;padding:6px 4px;border-left:0;border-top:2px solid transparent;
    justify-content:center;text-align:center}
  .nav-btn.is-active{border-left:0;border-top-color:var(--accent)}
  .nav-icon{font-size:18px;width:auto}
  .nav-label{font-size:9px}
  .nav-hot{display:none}
}

main{padding:24px 28px 80px;max-width:1280px;width:100%;margin:0 auto}
@media(max-width:820px){main{padding:18px 14px 40px}}

/* Boot */
.boot{position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:36px 8vw}
.boot-pre{font-family:var(--mono);font-size:13.5px;color:var(--accent);line-height:1.7;margin:0;
  text-shadow:0 0 6px rgba(163,230,53,.3);white-space:pre-wrap}
.boot-skip{margin-top:18px;font:inherit;font-family:var(--sans);background:var(--accent);color:#0a0b0c;
  border:0;padding:10px 18px;cursor:pointer;font-weight:600;letter-spacing:.04em}
.boot-skipall{position:absolute;top:18px;right:18px;font:inherit;background:transparent;
  border:1px solid var(--line-2);color:var(--text-3);padding:5px 10px;cursor:pointer}
.boot-skipall:hover{color:var(--text);border-color:var(--text-3)}

/* Setup */
.setup{max-width:520px;margin:60px auto;padding:32px;border:1px solid var(--line);background:var(--bg-2)}
.setup h2{font-family:var(--sans);font-weight:700;font-size:22px;margin:0 0 12px;letter-spacing:-.01em;color:var(--accent)}
.setup p{font-family:var(--sans);font-size:14.5px;color:var(--text-2);line-height:1.55}
.setup-form{display:flex;gap:8px;margin:18px 0 12px}
.setup-form input{flex:1;font:inherit;font-size:14px;padding:10px 12px;background:var(--bg);
  border:1px solid var(--line-2);color:var(--text);font-family:var(--mono)}
.setup-form input:focus{outline:0;border-color:var(--accent)}
.setup-form button{font:inherit;padding:10px 16px;background:var(--accent);color:#0a0b0c;
  border:0;cursor:pointer;font-weight:700;font-family:var(--sans);letter-spacing:.04em}
.setup-hint{font-size:12.5px;color:var(--text-3);font-family:var(--sans)}

/* Spotlight */
.spot-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;backdrop-filter:blur(2px)}
.spot{width:90%;max-width:640px;background:var(--bg-2);border:1px solid var(--line-2);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(163,230,53,.2)}
.spot-input{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.spot-prompt{color:var(--accent);font-weight:600}
.spot-input input{flex:1;font:inherit;font-size:15px;background:transparent;border:0;color:var(--text);outline:0;font-family:var(--mono)}
.spot-esc{font-size:9.5px;padding:2px 6px;border:1px solid var(--line-2);color:var(--text-3);letter-spacing:.06em}
.spot-list{max-height:50vh;overflow-y:auto}
.spot-item{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;
  width:100%;padding:10px 16px;background:transparent;border:0;border-bottom:1px solid var(--line);
  font:inherit;color:var(--text);text-align:left;cursor:pointer;font-family:var(--mono)}
.spot-item:hover{background:rgba(163,230,53,.06)}
.spot-kind{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.spot-kind.k-view{color:var(--accent)}
.spot-kind.k-day{color:var(--info)}
.spot-kind.k-week{color:var(--text-2)}
.spot-kind.k-exercise{color:var(--text)}
.spot-kind.k-proto{color:var(--warn)}
.spot-label{font-family:var(--sans);font-weight:500;font-size:14px}
.spot-hint{font-size:11px;color:var(--text-3)}
.spot-empty{padding:24px;text-align:center;color:var(--text-3)}

/* TODAY */
.today{display:flex;flex-direction:column;gap:24px}
.today-hero{padding-bottom:18px;border-bottom:1px solid var(--line)}
.today-eyebrow{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-3);font-variant-numeric:tabular-nums}
.today-eyebrow b{color:var(--accent);font-weight:600}
.today-eyebrow .dot-sep{color:var(--text-3);opacity:.6}
.today-eyebrow .off-track{color:var(--warn);font-weight:600}
.today-eyebrow .muted{color:var(--text-3)}
.today h1{font-family:var(--sans);font-weight:800;font-size:clamp(48px,9vw,96px);line-height:.95;
  margin:14px 0 6px;letter-spacing:-.03em}
.today h1 .muted{display:block;color:var(--text-3);font-size:.4em;letter-spacing:.04em;
  font-weight:500;text-transform:uppercase;margin-bottom:6px}
.today h1 .hero-name{color:var(--accent);text-shadow:0 0 24px rgba(163,230,53,.18)}
.today-sub{font-family:var(--sans);font-size:18px;color:var(--text-2);margin-top:4px}
.today-progbar{margin-top:22px}
.tpb-track{position:relative;height:6px;background:var(--bg-3);overflow:visible}
.tpb-fill{height:100%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.tpb-tick{position:absolute;top:-4px;width:1px;height:14px;background:var(--text-3);
  font-size:9.5px;color:var(--text-3);padding-left:4px;letter-spacing:.1em;white-space:nowrap}
.tpb-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-3);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tpb-meta b{color:var(--text)}

/* Banners */
.banner{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--bg-2);
  border:1px solid var(--line);border-left:3px solid var(--accent);font-family:var(--sans);font-size:13.5px;color:var(--text-2)}
.banner.deload{border-left-color:var(--warn)}
.banner.plateau{border-left-color:var(--danger)}
.banner-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--accent);
  padding:3px 8px;border:1px solid var(--accent);font-weight:600;flex-shrink:0}
.banner.deload .banner-tag{color:var(--warn);border-color:var(--warn)}
.banner.plateau .banner-tag{color:var(--danger);border-color:var(--danger)}
.banner button{font:inherit;background:transparent;border:0;color:var(--accent);cursor:pointer;
  text-decoration:underline;font-family:var(--mono);padding:0}

/* Today grid */
.today-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:880px){.today-grid{grid-template-columns:1fr}}
.today-card{background:var(--bg-2);border:1px solid var(--line);padding:18px 20px}
.session-card{cursor:pointer;transition:all .15s}
.session-card:hover{border-color:var(--accent);box-shadow:0 0 0 1px rgba(163,230,53,.2)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.card-eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.card-h{font-family:var(--sans);font-weight:600;font-size:18px;letter-spacing:-.01em;margin-top:3px}
.card-h .muted{color:var(--text-3);font-weight:400}
.card-cta{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:600;align-self:center}
.card-meta{font-size:11px;color:var(--text-3);letter-spacing:.06em;align-self:center}
.session-list{display:flex;flex-direction:column}
.sess-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:12px;padding:9px 0;
  border-bottom:1px dashed var(--line);font-family:var(--sans);font-size:14px;align-items:center}
.sess-row:last-child{border-bottom:0}
.sess-row.done{opacity:.5}
.sess-row.done .sess-name{text-decoration:line-through}
.sess-i{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.sess-rep{font-family:var(--mono);font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.sess-prog{font-family:var(--mono);font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.session-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.session-foot .all-done{color:var(--accent);font-weight:600}

.t-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:0 -2px}
.t-stat{background:var(--bg-2);padding:12px}
.t-stat-l{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.t-stat-v{font-family:var(--sans);font-weight:700;font-size:30px;line-height:1;margin-top:6px;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-stat-v small{font-size:13px;color:var(--text-2);font-weight:400;margin-left:2px}
.t-stat-s{font-size:10.5px;color:var(--text-3);margin-top:3px}

/* schedule */
.sched-list{display:flex;flex-direction:column;margin-top:8px}
.sched-row{display:grid;grid-template-columns:48px 50px 1fr;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);font-family:var(--sans);font-size:13px;align-items:baseline;
  color:var(--text-2)}
.sched-row.past{opacity:.45}
.sched-row.up{background:rgba(163,230,53,.05);padding-left:6px;padding-right:6px;margin:0 -6px;
  border-left:2px solid var(--accent)}
.sr-t{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);font-size:11.5px}
.sr-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
  border:1px solid var(--line-2);padding:1px 4px;text-align:center;align-self:center}

/* water */
.water-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wcup{background:transparent;border:0;cursor:pointer;color:var(--text-3);transition:all .15s;
  aspect-ratio:24/32;padding:0}
.wcup.full{color:var(--accent)}
.wcup:hover{transform:translateY(-2px)}
.water-foot{margin-top:10px;font-size:11px;color:var(--text-3);font-family:var(--sans)}
.today-note textarea{width:100%;font:inherit;font-family:var(--mono);padding:8px 10px;
  background:var(--bg);border:1px solid var(--line);color:var(--text);resize:vertical;margin-top:6px}
.today-note textarea:focus{outline:0;border-color:var(--accent)}

.today-quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.today-quick button{font:inherit;background:transparent;border:1px solid var(--line-2);color:var(--text-2);
  padding:6px 12px;cursor:pointer;font-size:11.5px;letter-spacing:.06em}
.today-quick button:hover{border-color:var(--accent);color:var(--accent)}

/* TRAIN */
.train{display:flex;flex-direction:column;gap:18px}
.train-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
@media(max-width:680px){.train-hero{grid-template-columns:1fr}}
.train-h-eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.train-hero h2{font-family:var(--sans);font-weight:800;font-size:clamp(40px,7vw,68px);line-height:1;
  margin:6px 0 4px;color:var(--accent);text-shadow:0 0 24px rgba(163,230,53,.2);letter-spacing:-.02em}
.train-h-sub{font-family:var(--sans);font-size:16px;color:var(--text-2)}
.train-meta{display:flex;gap:24px;flex-wrap:wrap;font-size:11px;color:var(--text-3);letter-spacing:.06em}
.tm b{color:var(--text);font-family:var(--sans);font-weight:600}
.tm.warn b{color:var(--warn)}
.tm.warn{color:var(--warn)}

.rest{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line-2)}
.rest-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.rest-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.rest.over .rest-time{color:var(--warn)}
.rest-lbl{font-size:10.5px;letter-spacing:.1em;color:var(--text-3);text-transform:uppercase}
.rest-heavy{margin-left:8px;color:var(--warn)}
.rest-btns{display:flex;gap:6px;margin-top:6px}
.rest-btns button{font:inherit;font-size:11px;padding:5px 10px;background:var(--accent);color:#0a0b0c;
  border:0;cursor:pointer;letter-spacing:.06em;font-weight:600;font-family:var(--mono)}
.rest-btns button.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text-2)}
.rest-btns button.ghost:hover{border-color:var(--text);color:var(--text)}

.ex-stack{display:flex;flex-direction:column;gap:10px}
.ex-card{border:1px solid var(--line);background:var(--bg-2)}
.ex-card.complete{opacity:.7;border-color:var(--accent)}
.ex-card.open{border-color:var(--accent);box-shadow:0 0 0 1px rgba(163,230,53,.2)}
.ex-head{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 18px;
  background:transparent;border:0;cursor:pointer;font:inherit;color:var(--text);text-align:left;gap:14px}
.ex-head:hover{background:rgba(255,255,255,.02)}
.ex-head-l{display:flex;gap:14px;align-items:center;flex:1;min-width:0}
.ex-num{font-family:var(--mono);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ex-title{font-family:var(--sans);font-weight:600;font-size:17px;letter-spacing:-.005em}
.ex-sub{font-size:11.5px;color:var(--text-3);margin-top:2px;font-variant-numeric:tabular-nums}
.ex-sub b{color:var(--text-2)}
.ex-note{color:var(--accent)}
.ex-head-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.rpe-tag{font-size:9.5px;letter-spacing:.12em;padding:2px 6px;border:1px solid var(--warn);color:var(--warn)}
.ex-prog{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.ex-card.complete .ex-prog{color:var(--accent)}
.ex-chev{color:var(--text-3);font-size:12px}

.ex-body{padding:0 18px 18px;border-top:1px dashed var(--line)}
.ex-prev{display:flex;gap:18px;flex-wrap:wrap;padding:10px 0;font-size:11.5px;color:var(--text-2);
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.ex-prev .muted{color:var(--text-3)}
.ex-prev b{color:var(--text)}
.ex-prev-sug b{color:var(--accent)}

.set-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.set-row{display:grid;grid-template-columns:60px 1fr 16px 1fr auto;gap:8px;align-items:center;
  padding:8px;background:var(--bg);border:1px solid var(--line)}
.set-row.done{border-color:var(--accent);background:rgba(163,230,53,.04)}
.set-n{font-size:10.5px;color:var(--text-3);letter-spacing:.08em}
.set-n b{color:var(--accent);font-family:var(--sans);font-weight:600;font-size:14px}
.set-target{color:var(--text-3);font-size:10px}
.set-row input{font:inherit;font-family:var(--mono);font-size:14.5px;padding:7px 10px;
  background:var(--bg-2);border:1px solid var(--line);color:var(--text);width:100%;text-align:center;
  font-variant-numeric:tabular-nums;border-radius:0}
.set-row input:focus{outline:0;border-color:var(--accent)}
.set-x{color:var(--text-3);text-align:center}
.set-go{font:inherit;font-family:var(--mono);font-size:11.5px;padding:7px 12px;background:var(--accent);
  color:#0a0b0c;border:0;cursor:pointer;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.set-row.done .set-go{background:transparent;color:var(--accent);border:1px solid var(--accent)}
@media(max-width:600px){
  .set-row{grid-template-columns:48px 1fr 12px 1fr auto;gap:5px;padding:6px}
  .set-row input{font-size:13px;padding:6px 4px}
  .set-go{font-size:10.5px;padding:6px 8px}
}

.ex-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
.ex-mark{font:inherit;font-family:var(--mono);font-size:11.5px;background:transparent;color:var(--text-2);
  border:1px solid var(--line-2);padding:7px 12px;cursor:pointer;letter-spacing:.04em}
.ex-mark:hover{border-color:var(--accent);color:var(--accent)}
.ex-hint{font-size:11px;color:var(--warn);font-family:var(--mono)}

.train-pushups{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  background:var(--bg-2);border:1px solid var(--line);padding:16px 18px;margin-top:8px}
@media(max-width:600px){.train-pushups{grid-template-columns:1fr}}
.tp-eyebrow{font-size:10px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.tp-target{font-family:var(--sans);font-size:15px;color:var(--text-2);margin-top:3px}
.tp-target b{color:var(--text);font-weight:600}
.pu-quick{display:flex;gap:6px}
.pu-quick input{font:inherit;font-family:var(--mono);font-size:14px;padding:8px 12px;
  background:var(--bg);border:1px solid var(--line-2);color:var(--text);width:90px;
  text-align:center;font-variant-numeric:tabular-nums}
.pu-quick input:focus{outline:0;border-color:var(--accent)}
.pu-quick button{font:inherit;font-family:var(--mono);font-size:11.5px;padding:8px 14px;
  background:var(--accent);color:#0a0b0c;border:0;cursor:pointer;font-weight:600;letter-spacing:.06em}

.train-rest{padding:32px;text-align:center}
.train-rest h2{font-family:var(--sans);font-size:48px;margin:0;color:var(--text-3);font-weight:700;letter-spacing:-.02em}
.train-rest-sub{font-family:var(--sans);font-size:16px;color:var(--text-2)}
.train-rest-card{margin:24px auto;padding:24px;background:var(--bg-2);border:1px solid var(--line);max-width:480px}
.train-rest-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.train-rest-actions button{font:inherit;font-family:var(--mono);font-size:12px;padding:8px 14px;
  background:transparent;border:1px solid var(--line-2);color:var(--text);cursor:pointer}
.train-rest-actions button:hover{border-color:var(--accent);color:var(--accent)}

/* PLAN */
.vh{font-family:var(--sans);font-weight:800;font-size:clamp(32px,5vw,52px);margin:0 0 18px;
  letter-spacing:-.02em;color:var(--text)}
.vh::before{content:"// ";color:var(--accent);font-weight:400}
.phase-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:18px}
@media(max-width:680px){.phase-row{grid-template-columns:1fr}}
.phase-btn{background:var(--bg-2);border:0;padding:14px 18px;cursor:pointer;text-align:left;
  font:inherit;font-family:var(--mono);color:var(--text-2);display:flex;flex-direction:column;gap:4px;
  transition:all .12s}
.phase-btn:hover{background:var(--bg-3)}
.phase-btn.is-active{background:var(--accent);color:#0a0b0c}
.phase-btn.is-active *{color:#0a0b0c !important}
.pb-id{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.pb-name{font-family:var(--sans);font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--text)}
.pb-meta{font-size:10.5px;color:var(--accent)}

.week-scrub{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
  padding:18px 20px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:14px}
@media(max-width:760px){.week-scrub{grid-template-columns:1fr}}
.ws-num{font-family:var(--sans);font-weight:700;font-size:48px;line-height:1;letter-spacing:-.03em;color:var(--text-3)}
.ws-num b{color:var(--accent);font-weight:800}
.ws-slider{position:relative;padding-bottom:24px}
.ws-slider input{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:24px;cursor:pointer}
.ws-slider input::-webkit-slider-runnable-track{height:4px;background:var(--bg-3)}
.ws-slider input::-moz-range-track{height:4px;background:var(--bg-3)}
.ws-slider input::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:18px;background:var(--accent);
  margin-top:-7px;cursor:pointer;box-shadow:0 0 8px var(--accent)}
.ws-slider input::-moz-range-thumb{width:4px;height:18px;background:var(--accent);border:0;cursor:pointer;box-shadow:0 0 8px var(--accent)}
.ws-ticks{position:absolute;left:0;right:0;bottom:0;height:18px}
.ws-ticks span{position:absolute;font-size:9.5px;color:var(--text-3);transform:translateX(-50%);letter-spacing:.06em}
.ws-ticks .ws-deload{color:var(--warn);top:-22px;font-weight:700}
.ws-meta{text-align:right;font-size:11.5px;color:var(--text-2)}
.ws-meta b{display:block;color:var(--accent);font-family:var(--sans);font-size:18px;font-weight:700}
.ws-meta b.warn{color:var(--warn)}
.ws-note{display:block;color:var(--text-3);font-size:10.5px;margin-top:4px}

.day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:0}
.ds-btn{background:var(--bg-2);border:0;padding:11px 8px;cursor:pointer;font:inherit;font-family:var(--mono);
  color:var(--text-2);display:flex;flex-direction:column;gap:3px;text-align:left;transition:all .1s}
.ds-btn:hover{background:var(--bg-3);color:var(--text)}
.ds-btn.is-active{background:var(--bg-3);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.ds-btn.rest .ds-name{color:var(--text-3)}
.ds-n{font-size:9.5px;letter-spacing:.12em;color:var(--text-3)}
.ds-btn.is-active .ds-n{color:var(--accent)}
.ds-name{font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:-.01em;color:var(--text)}
.ds-prog{font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ds-btn.is-active .ds-prog{color:var(--accent)}

.plan-detail{background:var(--bg-2);border:1px solid var(--line);border-top:0;padding:20px 22px;margin-bottom:22px}
.pd-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.pd-head h3{font-family:var(--sans);font-weight:700;font-size:24px;margin:0;letter-spacing:-.02em;line-height:1}
.pd-sub{font-size:11.5px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}
.pd-train{margin-left:auto;font:inherit;font-family:var(--mono);font-size:11.5px;background:var(--accent);
  color:#0a0b0c;border:0;padding:7px 14px;cursor:pointer;font-weight:600;letter-spacing:.06em}
.pd-list{display:flex;flex-direction:column}
.pd-row{display:grid;grid-template-columns:32px 1fr auto;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.pd-row:last-child{border-bottom:0}
.pd-i{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.pd-name{font-family:var(--sans);font-size:15px;color:var(--text)}
.pd-note{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:2px}
.pd-sets{font-family:var(--mono);font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pd-sets b{color:var(--accent)}

.plan-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:880px){.plan-grid{grid-template-columns:1fr}}
.plan-block{background:var(--bg-2);border:1px solid var(--line);padding:18px 22px}
.plan-block h3{font-family:var(--sans);font-weight:700;font-size:16px;margin:0 0 14px;letter-spacing:-.005em}

.macro-bars{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:13px;margin-bottom:16px}
.ascii-bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.ab-label{color:var(--text-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.1em}
.ab-track{color:var(--text-3);font-size:13px}
.ab-track b{color:var(--accent);font-weight:400}
.ab-val{color:var(--text);text-align:right;font-size:12px}

.meal-tbl{width:100%;border-collapse:collapse;font-size:12px}
.meal-tbl th,.meal-tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:400}
.meal-tbl th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.meal-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.meal-tbl .muted{color:var(--text-3);font-size:11.5px}

.sup-list{display:flex;flex-direction:column}
.sup-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.sup-row:last-child{border-bottom:0}
.sup-n{font-family:var(--sans);font-weight:500}
.sup-d{color:var(--accent);font-variant-numeric:tabular-nums}
.sup-note{grid-column:1/-1;font-size:11px;color:var(--text-3)}
.rules{margin:0;padding:0;list-style:none}
.rules li{padding:8px 0 8px 20px;font-family:var(--sans);font-size:13.5px;color:var(--text-2);position:relative;border-bottom:1px solid var(--line)}
.rules li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-family:var(--mono);font-weight:700}
.rules li:last-child{border-bottom:0}

/* LOG */
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.log-grid .span-2{grid-column:1/-1}
@media(max-width:780px){.log-grid{grid-template-columns:1fr}}
.log-card{background:var(--bg-2);border:1px solid var(--line);padding:18px 20px}
.wlog-form{display:flex;gap:8px;align-items:center;margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--line);font-size:11px;color:var(--text-2)}
.wlog-form .prompt{color:var(--accent);font-weight:500}
.wlog-form input{font:inherit;font-family:var(--mono);padding:6px 10px;background:var(--bg);
  border:1px solid var(--line-2);color:var(--text);width:90px}
.wlog-form input:focus{outline:0;border-color:var(--accent)}
.wlog-form button{font:inherit;font-family:var(--sans);padding:6px 12px;background:var(--accent);
  color:#0a0b0c;border:0;cursor:pointer;font-weight:600;letter-spacing:.04em}
.wlog-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{font:inherit;font-family:var(--mono);font-size:10.5px;padding:3px 8px;background:var(--bg-3);
  border:1px solid var(--line-2);color:var(--text-2);cursor:pointer}
.pill:hover{border-color:var(--danger);color:var(--danger)}

/* Heatmap */
.hm{margin-top:8px}
.hm-cols{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.hm-col{display:flex;flex-direction:column;gap:2px}
.hm-cell{aspect-ratio:1;background:var(--accent);opacity:var(--op,.06);position:relative}
.hm-cell.rest{background:var(--info)}
.hm-cell.deload{outline:1px solid var(--warn);outline-offset:-1px}
.hm-wk{font-size:8.5px;color:var(--text-3);margin-top:3px;text-align:center;letter-spacing:.04em;height:10px}
.hm-legend{display:flex;gap:14px;margin-top:12px;font-size:10.5px;color:var(--text-3);letter-spacing:.06em}
.hm-dot{display:inline-block;width:9px;height:9px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.hm-dot.d0{opacity:.06}.hm-dot.d1{opacity:.4}.hm-dot.d2{opacity:1}
.hm-dot.deload{opacity:.4;outline:1px solid var(--warn);outline-offset:-1px}

/* PR list */
.pr-card{margin-bottom:18px}
.pr-list{display:flex;flex-direction:column}
.pr-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:9px 0;
  border-bottom:1px dashed var(--line);font-family:var(--sans);font-size:14px;align-items:baseline}
.pr-name{font-weight:500}
.pr-load{font-family:var(--mono);font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pr-load b{color:var(--accent);font-weight:600}
.pr-when{font-family:var(--mono);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.empty{padding:24px;text-align:center;color:var(--text-3);font-style:italic}

/* PROTOCOLS */
.proto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
@media(max-width:880px){.proto-grid{grid-template-columns:1fr}}
.proto-card{background:var(--bg-2);border:1px solid var(--line);padding:18px 20px;position:relative}
.proto-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:.4}
.proto-card.active::before{opacity:1;box-shadow:0 0 12px var(--accent)}
.proto-head{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.proto-card h3{font-family:var(--sans);font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
.proto-cad{font-size:10.5px;color:var(--text-3);letter-spacing:.08em;margin-top:3px;display:block}
.proto-card ol{margin:0;padding-left:0;list-style:none;counter-reset:pc}
.proto-card li{counter-increment:pc;padding:8px 0 8px 28px;font-family:var(--sans);font-size:13px;
  color:var(--text-2);line-height:1.45;border-bottom:1px solid var(--line);position:relative}
.proto-card li::before{content:counter(pc,decimal-leading-zero);position:absolute;left:0;top:8px;
  font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.06em}
.proto-card li:last-child{border-bottom:0}
.proto-note{font-family:var(--sans);font-style:italic;font-size:12.5px;color:var(--text-3);
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

.fallback-tool{background:var(--bg-2);border:1px solid var(--line);padding:20px 22px}
.fallback-tool h3{font-family:var(--sans);font-weight:700;font-size:16px;margin:0 0 6px;color:var(--accent)}
.fallback-tool p{font-family:var(--sans);font-size:13.5px;color:var(--text-2)}
.fb-q{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px}
.fb-btns{display:flex;gap:6px}
.fb-btns button{font:inherit;font-family:var(--mono);font-size:11px;padding:6px 14px;background:transparent;
  border:1px solid var(--line-2);color:var(--text-2);cursor:pointer;letter-spacing:.06em}
.fb-btns button.on{background:var(--accent);color:#0a0b0c;border-color:var(--accent);font-weight:600}
.fb-out{margin-top:14px;padding:12px 14px;border:1px solid;font-family:var(--sans);font-size:13.5px}
.fb-out.on{border-color:var(--danger);color:var(--danger);background:rgba(248,113,113,.06)}
.fb-out.off{border-color:var(--accent);color:var(--text-2);background:rgba(163,230,53,.04)}

/* Footer */
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--text-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.foot button{font:inherit;background:transparent;border:1px solid var(--line-2);color:var(--text-3);padding:5px 10px;cursor:pointer}
.foot button:hover{border-color:var(--danger);color:var(--danger)}

/* density: compact */
body.compact main{padding:18px 20px 80px}
body.compact .today-card,body.compact .log-card,body.compact .plan-block,
body.compact .proto-card{padding:14px 16px}
body.compact .ex-head{padding:11px 14px}
body.compact .ex-body{padding:0 14px 14px}

/* ---- meal tracker ---- */
.meals-card .meals-totals{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.meals-card .meals-totals b{color:var(--accent);font-weight:600}
.meals-card .meals-totals .muted{color:var(--text-3)}
.meals-progress{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-family:var(--mono);font-size:10px}
.mp-row{display:grid;grid-template-columns:36px 1fr 36px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.mp-l{color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;font-size:9.5px}
.mp-track{height:6px;background:var(--bg-3);position:relative;overflow:hidden}
.mp-fill{position:absolute;inset:0;width:0;background:var(--accent);transition:width .3s}
.mp-fill.prot{background:var(--info)}
.mp-v{text-align:right;color:var(--text-2);font-size:10.5px}
.meals-list{display:flex;flex-direction:column;margin:0 -4px}
.meal-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;padding:8px 4px;
  border-bottom:1px dashed var(--line);align-items:center;font-family:var(--sans);font-size:13px}
.meal-row:last-child{border-bottom:0}
.meal-row.eaten{opacity:.5}
.meal-row.eaten .meal-slot{text-decoration:line-through}
.meal-row.skipped{opacity:.55}
.meal-row.skipped .meal-tick{color:var(--danger);border-color:var(--danger)}
.meal-tick{font:inherit;width:24px;height:24px;background:transparent;border:1px solid var(--line-2);
  color:var(--text-3);cursor:pointer;font-family:var(--mono);font-size:13px;padding:0}
.meal-row.eaten .meal-tick{border-color:var(--accent);color:var(--accent);background:rgba(163,230,53,.1)}
.meal-tick:hover{border-color:var(--accent);color:var(--accent)}
.meal-mid{min-width:0}
.meal-slot{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.meal-crit{display:inline-block;width:14px;height:14px;line-height:13px;text-align:center;
  background:var(--warn);color:#0a0b0c;font-size:10px;font-weight:700;border-radius:50%}
.meal-what{font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-top:2px;line-height:1.4}
.meal-num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--text-3)}
.meal-num .meal-kcal{color:var(--text-2)}
.meal-num .meal-p b{color:var(--accent);font-weight:600}
.meal-skip{font:inherit;font-family:var(--mono);font-size:10px;background:transparent;border:0;
  color:var(--text-3);cursor:pointer;letter-spacing:.06em;padding:2px 4px}
.meal-skip:hover{color:var(--danger)}
.meals-warn{margin-top:10px;padding:8px 12px;background:rgba(251,191,36,.08);border-left:2px solid var(--warn);
  font-family:var(--sans);font-size:12.5px;color:var(--text-2);line-height:1.5}
.meals-warn b{color:var(--warn)}

/* ---- quick weight log ---- */
.qwl{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-top:10px;
  background:var(--bg-3);border:1px dashed var(--line-2);font-family:var(--mono);font-size:11.5px;color:var(--text-2)}
.qwl.mon{background:rgba(163,230,53,.08);border-color:var(--accent);border-style:solid}
.qwl-l{flex:1;letter-spacing:.06em}
.qwl.mon .qwl-l{color:var(--accent);font-weight:700;letter-spacing:.1em}
.qwl input{font:inherit;font-family:var(--mono);padding:5px 10px;background:var(--bg);
  border:1px solid var(--line-2);color:var(--text);width:80px;text-align:center;font-variant-numeric:tabular-nums}
.qwl input:focus{outline:0;border-color:var(--accent)}
.qwl button{font:inherit;font-family:var(--mono);padding:6px 12px;background:var(--accent);
  color:#0a0b0c;border:0;cursor:pointer;font-weight:600;font-size:11px;letter-spacing:.06em}
.qwl.logged{background:transparent;border-style:dashed}
.qwl-v{font-family:var(--sans);font-weight:700;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.qwl-edit{font:inherit;font-family:var(--mono);font-size:10px;padding:3px 8px;background:transparent;
  border:1px solid var(--line-2);color:var(--text-3);cursor:pointer}
.qwl-edit:hover{border-color:var(--text-3);color:var(--text)}

/* ---- daily push-ups ---- */
.pushup-today{margin-top:0}
.pu-pellets{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0 10px}
.pu-pellet{width:11px;height:11px;background:var(--bg-3);border:1px solid var(--line-2);transition:all .12s}
.pu-pellet.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 4px var(--accent)}
.pu-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pu-step{font:inherit;font-family:var(--mono);font-size:12px;padding:7px 12px;background:transparent;
  border:1px solid var(--line-2);color:var(--text);cursor:pointer;letter-spacing:.04em;font-weight:600}
.pu-step:hover{border-color:var(--accent);color:var(--accent)}
.pu-row input{font:inherit;font-family:var(--mono);font-size:13px;padding:7px 10px;background:var(--bg);
  border:1px solid var(--line-2);color:var(--text);width:70px;text-align:center}
.pu-row input:focus{outline:0;border-color:var(--accent)}
.pu-done{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em;font-weight:700;margin-left:auto}

/* ---- skip bar ---- */
.skip-bar{display:flex;justify-content:flex-end;margin-top:-6px}
.skip-btn{font:inherit;font-family:var(--mono);font-size:10.5px;background:transparent;
  border:1px dashed var(--line-2);color:var(--text-3);padding:5px 10px;cursor:pointer;letter-spacing:.06em}
.skip-btn:hover{border-color:var(--warn);color:var(--warn)}

/* heatmap clickable */
.hm-cell{cursor:pointer}
.hm-cell:hover{outline:1px solid var(--accent);outline-offset:0;z-index:2;position:relative}

@media print{
  .nav,.topbar,.foot,.tweaks-panel{display:none !important}
  body{background:white;color:black}
  main{padding:0}
}

/* ============================================================
   MOBILE — the app is used phone-first at the gym.
   Targets: thumb reach, 44px hit targets, no overflow, no zoom.
   ============================================================ */
@media (max-width: 720px) {
  html, body { font-size: 15px; -webkit-text-size-adjust: 100%; }
  body { overflow-x: hidden; }

  /* Top bar — collapse to icon + day indicator only */
  .topbar { padding: 8px 12px; font-size: 10.5px; }
  .topbar .brand { font-size: 12px; letter-spacing: .04em; }
  .day-ind { font-size: 10.5px; gap: 2px; }
  .day-ind .key { display: none; }
  .day-ind b { font-size: 11.5px; }
  .topbar .tr { gap: 8px; }
  .streak { font-size: 10.5px; }
  .todaybtn { padding: 4px 8px; font-size: 10px; letter-spacing: .04em; }
  .kbd-hint { display: none; }  /* no keyboard on phone */

  /* Layout — bottom nav was already responsive, but tighten it */
  .app { padding-bottom: 64px; }
  main { padding: 14px 14px 32px; }
  .nav { padding: 0; }
  .nav-btn { padding: 8px 2px 6px; gap: 1px; }
  .nav-icon { font-size: 17px; }
  .nav-label { font-size: 9.5px; letter-spacing: .04em; }

  /* HERO — smaller, less air */
  .today-hero { padding-bottom: 14px; margin-bottom: 14px; }
  .today h1 { font-size: 56px; line-height: .94; margin: 10px 0 4px; }
  .today h1 .muted { font-size: .35em; }
  .today-sub { font-size: 14px; }
  .today-eyebrow { font-size: 9.5px; gap: 6px; }
  .today-eyebrow .dot-sep { display: none; }
  .today-progbar { margin-top: 14px; }
  .tpb-meta { font-size: 10px; }

  /* Grid stacks naturally — tighten gap */
  .today-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
  .today-card { padding: 14px 14px; }
  .card-h { font-size: 16px; }
  .card-eyebrow { font-size: 9px; }
  .card-cta { font-size: 10.5px; padding: 4px 8px; border: 1px solid var(--accent); align-self: flex-start; }

  /* Banners — full-width, less aggressive */
  .banner { padding: 10px 12px; font-size: 12.5px; flex-direction: column; align-items: flex-start; gap: 6px; }
  .banner-tag { font-size: 9px; }

  /* TELEMETRY stats — 2-col stays */
  .t-stats { grid-template-columns: 1fr 1fr !important; }
  .t-stat { padding: 10px 12px; }
  .t-stat-v { font-size: 22px; }
  .t-stat-l { font-size: 9px; }

  /* MEALS card */
  .meal-row { grid-template-columns: 28px 1fr auto; gap: 8px; padding: 9px 0; }
  .meal-row .meal-skip { grid-column: 1 / -1; justify-self: end; margin-top: -4px; font-size: 10px; }
  .meal-tick { width: 28px; height: 28px; font-size: 14px; }  /* bigger tap target */
  .meal-slot { font-size: 13px; }
  .meal-what { font-size: 11px; }
  .meal-num { font-size: 10.5px; min-width: 56px; }
  .meals-progress { font-size: 9.5px; }
  .mp-l { font-size: 9px; }

  /* Quick weight log */
  .qwl { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
  .qwl-l { font-size: 10.5px; width: 100%; }
  .qwl input { font-size: 16px; padding: 8px 10px; flex: 1; width: auto; min-width: 0; }  /* 16px prevents iOS zoom */
  .qwl button { padding: 8px 14px; min-height: 36px; }

  /* Pushup card */
  .pushup-today .card-h { font-size: 15px; }
  .pu-pellets { gap: 4px; }
  .pu-pellet { width: 14px; height: 14px; }
  .pu-row { gap: 6px; }
  .pu-step { min-height: 40px; padding: 8px 14px; font-size: 13px; }
  .pu-row input { font-size: 16px; padding: 8px 10px; min-height: 40px; width: 60px; }
  .pu-done { width: 100%; margin-left: 0; text-align: center; }

  /* Schedule */
  .sched-row { grid-template-columns: 44px 36px 1fr; gap: 8px; padding: 6px 0; font-size: 12.5px; }
  .sr-t { font-size: 11px; }
  .sr-tag { font-size: 8.5px; padding: 1px 3px; }

  /* Water */
  .water-grid { gap: 5px; }
  .wcup { aspect-ratio: 24/30; }
  .water-foot { font-size: 10.5px; }
  .today-note textarea { font-size: 14px; padding: 8px; }

  /* TRAIN */
  .train-hero { padding-bottom: 12px; }
  .train-hero h2 { font-size: 40px; margin: 4px 0; }
  .train-h-sub { font-size: 14px; }
  .train-h-eyebrow { font-size: 10px; }

  .rest { padding: 8px 10px; gap: 10px; align-self: stretch; }
  .rest-ring { width: 52px; height: 52px; }
  .rest-ring svg { width: 52px; height: 52px; }
  .rest-time { font-size: 13px; }
  .rest-lbl { font-size: 10px; }
  .rest-btns { gap: 4px; }
  .rest-btns button { padding: 8px 10px; min-height: 38px; font-size: 11px; }

  .train-meta { gap: 10px; font-size: 10.5px; }

  .ex-card { border-radius: 0; }
  .ex-head { padding: 12px 12px; min-height: 60px; }  /* big tap target */
  .ex-head-l { gap: 10px; }
  .ex-num { font-size: 10.5px; }
  .ex-title { font-size: 15px; line-height: 1.2; }
  .ex-sub { font-size: 11px; }
  .rpe-tag { font-size: 9px; padding: 2px 5px; }
  .ex-prog { font-size: 11px; min-width: 28px; }
  .ex-body { padding: 0 12px 14px; }

  .ex-prev { gap: 8px; font-size: 10.5px; padding: 8px 0; flex-direction: column; }

  .ex-video { font-size: 11px; padding: 8px 12px; min-height: 36px; display: inline-flex; align-items: center; }

  /* SET ROW — biggest mobile pain point in the original. Make it work. */
  .set-row { grid-template-columns: 38px 1fr 10px 1fr auto; gap: 4px; padding: 6px; min-height: 48px; }
  .set-row input { font-size: 16px !important; padding: 8px 4px; min-height: 40px; }  /* 16px prevents iOS auto-zoom on focus */
  .set-row .set-n { font-size: 9.5px; }
  .set-row .set-n b { font-size: 13px; }
  .set-target { display: none; }  /* implicit, save space */
  .set-x { font-size: 12px; }
  .set-go { padding: 8px 10px; font-size: 10.5px; min-height: 40px; min-width: 52px; }

  .ex-actions { gap: 6px; }
  .ex-mark { width: 100%; padding: 10px; min-height: 42px; font-size: 12px; }
  .ex-hint { font-size: 10.5px; width: 100%; }

  /* TRAIN pushups footer */
  .train-pushups { grid-template-columns: 1fr; gap: 10px; padding: 14px; }

  /* PLAN */
  .vh { font-size: 28px; margin-bottom: 12px; }
  .phase-row { grid-template-columns: 1fr; gap: 1px; }
  .phase-btn { padding: 10px 14px; min-height: 56px; }
  .pb-name { font-size: 16px; }
  .pb-id { font-size: 9px; }
  .pb-meta { font-size: 10px; }
  .week-scrub { grid-template-columns: 1fr; gap: 12px; padding: 14px; }
  .ws-num { font-size: 36px; text-align: left; }
  .ws-slider input { height: 38px; }  /* fat thumb-friendly slider */
  .ws-slider input::-webkit-slider-thumb { width: 8px; height: 24px; margin-top: -10px; }
  .ws-slider input::-moz-range-thumb { width: 8px; height: 24px; }
  .ws-meta { text-align: left; font-size: 11px; }

  /* Day strip — 7 days on phone is tight. Make scrollable instead of squished. */
  .day-strip { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; gap: 1px; margin: 0 -14px; padding: 0 14px; }
  .day-strip::-webkit-scrollbar { display: none; }
  .ds-btn { flex: 0 0 auto; min-width: 76px; scroll-snap-align: start; padding: 10px 14px; min-height: 56px; }
  .ds-btn.is-active { box-shadow: inset 3px 0 0 var(--accent); }
  .ds-name { font-size: 14px; }
  .ds-n { font-size: 9px; }
  .ds-prog { font-size: 10.5px; }

  .plan-detail { padding: 14px; }
  .pd-head h3 { font-size: 22px; }
  .pd-sub { font-size: 10.5px; }
  .pd-train { width: 100%; padding: 10px; font-size: 11px; min-height: 40px; margin-top: 4px; }
  .pd-row { grid-template-columns: 24px 1fr auto; padding: 8px 0; }
  .pd-name { font-size: 14px; }
  .pd-vid { display: block; margin: 4px 0 0 0; padding: 4px 8px; font-size: 11px; }
  .pd-note { font-size: 11px; }
  .pd-sets { font-size: 11px; }

  .plan-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
  .plan-block { padding: 14px; }
  .plan-block h3 { font-size: 15px; }
  .macro-bars { font-size: 11px; }
  .ab-track { font-size: 11px; }
  .meal-tbl { font-size: 11px; }
  .meal-tbl th { font-size: 9px; }
  .meal-tbl td { padding: 6px 4px; }
  .meal-tbl .muted { font-size: 10.5px; }
  .meal-swap-input { font-size: 11px; }
  .meal-out-row { flex-direction: column; align-items: flex-start; gap: 6px; }
  .mor-l { font-size: 9px; }

  .sup-row { grid-template-columns: 1fr; gap: 2px; padding: 8px 0; }
  .sup-d { font-size: 11.5px; }

  /* LOG */
  .log-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
  .log-grid .span-2 { grid-column: auto !important; }
  .log-card { padding: 14px; }
  .pr-row { grid-template-columns: 1fr auto; gap: 6px; padding: 8px 0; }
  .pr-when { grid-column: 1 / -1; font-size: 10px; }

  /* Compliance heatmap — fit on screen */
  .hm-cell { aspect-ratio: auto; height: 14px; }
  .hm-wk { font-size: 7.5px; height: 8px; }

  /* PROTOCOLS */
  .proto-grid { grid-template-columns: 1fr !important; }
  .proto-card { padding: 14px; }
  .fb-q { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 0; }
  .fb-btns { width: 100%; gap: 6px; }
  .fb-btns button { flex: 1; padding: 10px; min-height: 40px; font-size: 12px; }
  .fb-out { font-size: 13px; padding: 12px; }

  /* EXPORT */
  .export-pre { font-size: 10.5px; padding: 10px; max-height: 50vh; }
  .ea-btn, .ea-tab { padding: 8px 12px; min-height: 38px; font-size: 10.5px; }

  /* Foot bar */
  .foot { flex-direction: column; align-items: flex-start; gap: 8px; font-size: 10px; }
  .foot button { width: 100%; padding: 10px; }

  /* TWEAKS panel on phone — bottom sheet style */
  .tweaks-host { right: 10px !important; bottom: 80px !important; left: 10px !important; max-width: none !important; }

  /* Video modal — fullscreen on phone (already partial) */
  .vmod { height: 100vh; max-height: 100vh; }
  .vmod-thumb img { object-fit: cover; }
}

/* Very small phones (iPhone SE etc.) */
@media (max-width: 400px) {
  main { padding: 12px 10px 32px; }
  .today h1 { font-size: 44px; }
  .vh { font-size: 24px; }
  .train-hero h2 { font-size: 32px; }
  .ws-num { font-size: 30px; }
}

/* Prevent the body from accidentally being zoomable when an input is focused.
   We use font-size:16px on inputs above to keep iOS from auto-zooming.
   This handles edge cases. */
@supports (-webkit-touch-callout: none) {
  input, select, textarea { font-size: 16px !important; }
}

/* form video links */
.ex-video{display:inline-block;margin-bottom:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  color:var(--info);background:transparent;border:0;border-bottom:1px dashed var(--info);padding:1px 0;cursor:pointer}
.ex-video:hover{color:var(--accent);border-bottom-color:var(--accent)}
.pd-vid{display:inline-block;margin-left:10px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:var(--info);background:transparent;border:0;border-bottom:1px dashed var(--info);padding:0 2px;vertical-align:middle;cursor:pointer}
.pd-vid:hover{color:var(--accent);border-bottom-color:var(--accent)}

/* === Video modal — mobile-first, big tap targets === */
.vmod-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:vmodFadeIn .15s ease-out;backdrop-filter:blur(4px)}
@keyframes vmodFadeIn{from{opacity:0}to{opacity:1}}
.vmod{width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;
  background:var(--bg);border:1px solid var(--accent);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 24px 64px rgba(0,0,0,.6),0 0 36px rgba(163,230,53,.18);
  font-family:var(--mono);overflow:auto;overscroll-behavior:contain}

.vmod-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg-2);
  position:sticky;top:0;z-index:1}
.vmod-title{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.vmod-eyebrow{font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:600}
.vmod-name{font-size:15px;color:var(--text);font-weight:500;line-height:1.3}
.vmod-close{font-family:var(--mono);font-size:16px;background:transparent;
  color:var(--text-3);border:1px solid var(--line-2);padding:6px 12px;cursor:pointer;
  min-width:44px;min-height:36px;line-height:1;flex-shrink:0}
.vmod-close:hover,.vmod-close:active{color:var(--danger);border-color:var(--danger)}

/* PRIMARY: NewPipe CTA — biggest, top, ad-free */
.vmod-newpipe{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:14px 14px 0;padding:18px 18px;background:var(--accent);color:#0a0e0a;
  text-decoration:none;font-family:var(--mono);font-weight:600;letter-spacing:.04em;
  border:0;cursor:pointer;transition:transform .1s,background .12s}
.vmod-newpipe:hover{background:#bef264}
.vmod-newpipe:active{transform:scale(.98)}
.vmod-np-l{display:flex;align-items:center;gap:14px;min-width:0}
.vmod-np-icon{font-size:24px;line-height:1;flex-shrink:0}
.vmod-np-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.vmod-np-text b{font-size:14px;letter-spacing:.06em;font-weight:700}
.vmod-np-text small{font-size:10.5px;font-weight:500;opacity:.78;letter-spacing:.04em}
.vmod-np-arrow{font-size:22px;flex-shrink:0;font-weight:700}

/* Instance status bar — current Invidious host + rotate */
.vmod-instance{margin:14px 14px 0;padding:10px 14px;background:var(--bg-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  gap:10px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
.vmod-inst-l{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.vmod-inst-flag{font-size:14px;flex-shrink:0}
.vmod-inst-host{color:var(--accent);font-weight:600;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vmod-inst-meta{color:var(--text-3);font-size:10px;letter-spacing:.08em}
.vmod-inst-next{font:inherit;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  background:transparent;border:1px solid var(--line-2);color:var(--text-2);
  padding:6px 10px;cursor:pointer;min-height:36px}
.vmod-inst-next:hover,.vmod-inst-next:active{border-color:var(--accent);color:var(--accent)}

.vmod-link-btn.pri{border-color:var(--accent);background:rgba(163,230,53,.04)}
.vmod-link-btn.pri:hover,.vmod-link-btn.pri:active{background:rgba(163,230,53,.08);border-color:var(--accent)}

.vmod-foot-note{font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  line-height:1.55;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}

/* Inline embed frame (only when we have a YouTube ID) */
.vmod-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;margin:14px 0 0}
.vmod-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmod-fallback{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  color:var(--text-2)}
.vmod-fb-icon{font-size:36px;color:var(--warn)}
.vmod-fb-msg{font-size:13.5px;line-height:1.55;font-family:var(--mono)}

/* Search card (when video is a search query, not an ID) */
.vmod-search{margin:14px 14px 0;padding:18px;background:var(--bg-2);
  border:1px dashed var(--line-2);text-align:left}
.vmod-search-eyebrow{font-size:9.5px;letter-spacing:.16em;color:var(--text-3);font-weight:600}
.vmod-search-q{font-family:var(--mono);font-size:15px;color:var(--accent);
  margin-top:6px;line-height:1.4;word-break:break-word}
.vmod-search-note{font-size:12px;color:var(--text-3);line-height:1.55;margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--line)}

/* Foot: source mode toggle (only with ID) + alternate-link buttons */
.vmod-foot{padding:14px;display:flex;flex-direction:column;gap:10px;
  border-top:1px solid var(--line);margin-top:14px}
.vmod-mode{display:flex;flex-wrap:wrap;gap:6px}
.vmod-mode-btn{flex:1;min-width:120px;font:inherit;font-family:var(--mono);
  background:transparent;border:1px solid var(--line-2);color:var(--text-2);
  padding:10px 12px;cursor:pointer;letter-spacing:.04em;font-size:11.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center}
.vmod-mode-btn small{font-size:9.5px;color:var(--text-3);font-weight:400}
.vmod-mode-btn:hover{border-color:var(--text-3);color:var(--text)}
.vmod-mode-btn.on{background:var(--accent);color:#0a0e0a;border-color:var(--accent);font-weight:600}
.vmod-mode-btn.on small{color:#0a0e0a;opacity:.7}
.vmod-retry{font:inherit;font-family:var(--mono);background:transparent;
  border:1px solid var(--warn);color:var(--warn);padding:10px 12px;cursor:pointer;
  letter-spacing:.06em;font-size:11px}

.vmod-links{display:flex;flex-direction:column;gap:6px}
.vmod-link-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 14px;background:var(--bg-2);border:1px solid var(--line);
  color:var(--text);text-decoration:none;font-family:var(--mono);font-size:13px;
  min-height:48px;transition:all .12s}
.vmod-link-btn:hover,.vmod-link-btn:active{border-color:var(--accent);background:var(--bg-3);color:var(--accent)}
.vmod-link-btn small{color:var(--text-3);font-size:10.5px;letter-spacing:.04em;text-align:right}
.vmod-link-btn:hover small{color:var(--text-2)}

@media(max-width:600px){
  .vmod-bg{padding:0;align-items:stretch}
  .vmod{width:100%;max-height:100vh;height:100%;border:0;border-radius:0}
  .vmod-newpipe{padding:20px 18px}
  .vmod-np-text b{font-size:15px}
}

/* === verifier-round-2 additions === */
.t-stat-v.warn{color:var(--warn)}
.sr-t.tag-supp,.sched-row.supp .sr-t{color:var(--info)}
.sched-row.supp{border-left:2px solid var(--info);padding-left:6px;margin-left:-8px}
.sched-row.supp .sr-tag{color:var(--info);border-color:var(--info)}

.ex-flash{animation:exFlash 1.6s ease-out;position:relative}
@keyframes exFlash{
  0%{background:rgba(163,230,53,.22);box-shadow:inset 0 0 0 1px var(--accent)}
  100%{background:transparent;box-shadow:inset 0 0 0 1px transparent}
}

.meal-swap-input{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line-2);
  font:inherit;color:var(--accent);padding:2px 0;font-family:var(--mono);font-size:11.5px;outline:none}
.meal-swap-input:focus{border-bottom-color:var(--accent);background:rgba(163,230,53,.04)}
.meal-swap-input::placeholder{color:var(--text-3);opacity:.6}

.meal-out-row{display:flex;align-items:center;gap:14px;margin-top:14px;padding:10px 12px;
  background:var(--bg-2);border-left:2px solid var(--accent)}
.mor-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--text-3);flex-shrink:0}
.meal-out-input{flex:1;background:transparent;border:0;border-bottom:1px dashed var(--line-2);
  font:inherit;color:var(--text);padding:3px 0;outline:none;font-size:13px}
.meal-out-input:focus{border-bottom-color:var(--accent)}
.meal-out-input::placeholder{color:var(--text-3);opacity:.6}

/* export view */
.export{padding:20px 24px;max-width:1100px}
.export-sub{color:var(--text-2);font-size:13.5px;line-height:1.55;max-width:640px;margin-bottom:18px}
.export-actions{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ea-tab{font:inherit;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  background:transparent;border:1px solid var(--line);color:var(--text-2);padding:7px 14px;cursor:pointer}
.ea-tab.on{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}
.ea-tab:hover:not(.on){border-color:var(--accent);color:var(--accent)}
.ea-spacer{flex:1}
.ea-btn{font:inherit;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 14px;cursor:pointer}
.ea-btn:hover{background:var(--accent);color:#0a0a0a}
.export-pre{background:var(--bg-2);border:1px solid var(--line);padding:18px 20px;
  font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;
  max-height:62vh;overflow:auto;margin:0;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .export{padding:14px}
  .export-pre{font-size:10.5px;padding:12px}
}

/* ============================================================
   MOBILE PASS — applies at all phone widths.
   Fixes: iOS input zoom, tap targets, table reflow, overflow.
   ============================================================ */
@media (max-width:680px){
  /* iOS auto-zooms on focus for any input <16px. Force ≥16px on all inputs. */
  input, select, textarea, button{font-size:16px !important}
  /* But keep some specific labels small via specific overrides below if needed. */

  /* Bottom-nav clearance — Nav is fixed at bottom on mobile. */
  main{padding:16px 14px 90px !important}

  /* Hero — keep big but never overflow. */
  .today h1{font-size:clamp(40px,12vw,72px);overflow-wrap:break-word;hyphens:auto}
  .today h1 .muted{font-size:.36em}
  .train-hero h2{font-size:clamp(34px,10vw,60px);overflow-wrap:break-word}

  /* Top bar — show fewer counters on mobile, condense */
  .topbar{padding:8px 12px;font-size:10.5px;gap:6px}
  .topbar .tl{gap:8px;min-width:0;flex:1}
  .topbar .brand{font-size:11.5px}
  .day-ind{font-size:10px}
  .day-ind .key{display:none}
  .topbar .tr{gap:8px}
  .todaybtn{padding:5px 8px;font-size:10.5px}
  .kbd-hint{display:none}
  .streak{font-size:10.5px}

  /* Cards: tighten padding */
  .today-card,.log-card,.plan-block,.proto-card,.daypane,.scrubpanel{padding:14px 14px}
  .ex-head{padding:12px 14px}
  .ex-body{padding:0 14px 14px}

  /* Day strip — 7 cells crush. Shrink padding, hide subtext lines. */
  .day-strip,.daystrip{margin:0 -2px}
  .ds-btn{padding:9px 4px;gap:2px}
  .ds-btn .ds-n,.day-tab .n{font-size:8.5px;letter-spacing:.08em}
  .ds-btn .ds-name,.day-tab .nm{font-size:12px}
  .ds-btn .ds-prog,.day-tab .pg{font-size:9.5px}

  /* Today telemetry — keep 2×2 but tighten */
  .t-stat-v{font-size:24px}
  .t-stat-l{font-size:9px}
  .t-stat{padding:10px 10px}

  /* Water grid — 7 cups across is too tight on narrow phones. 4+3 layout. */
  .water-grid{grid-template-columns:repeat(7,1fr);gap:4px}
  @supports (width:min(100vw,360px)){
    .water-grid{grid-template-columns:repeat(auto-fit,minmax(34px,1fr))}
  }
  .wcup{aspect-ratio:auto;height:48px}

  /* Macros progress bars in meal tracker */
  .mp-row{grid-template-columns:32px 1fr 36px;gap:6px}
  .mp-l{font-size:9px}
  .mp-v{font-size:10px}

  /* Schedule row: less wasted gutter */
  .sched-row,.schedrow{grid-template-columns:46px 44px 1fr;gap:8px;padding:9px 0}
  .sr-t{font-size:11px}
  .sr-tag{font-size:8.5px}

  /* Set logger — keep horizontal but make compact and tappable */
  .set-row{grid-template-columns:44px 1fr 12px 1fr auto;gap:6px;padding:8px 8px;align-items:center}
  .set-row input{font-size:16px !important;padding:9px 6px;min-width:0}
  .set-n{font-size:10px}
  .set-n b{font-size:13px}
  .set-go{padding:9px 12px;font-size:11.5px;min-height:44px}
  /* Above 380px keep horizontal; below, stack the "× reps" inputs */
  @media (max-width:380px){
    .set-row{grid-template-columns:36px 1fr auto;gap:6px}
    .set-row .set-x{display:none}
    .set-row input{grid-column:auto}
    /* visual hint: a colon-like separator via input placeholders */
  }

  /* Plan meal table → stack into card-like rows.
     Each row becomes a flex container, cells become labelled fields. */
  .meal-tbl,.meal-tbl tbody,.meal-tbl tr,.meal-tbl td,.meal-tbl th{display:block}
  .meal-tbl thead{display:none}
  .meal-tbl tr{padding:12px 12px;border:1px solid var(--line);margin-bottom:8px;background:var(--bg)}
  .meal-tbl td{padding:3px 0;border:0;font-size:13px}
  .meal-tbl td:first-child{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--text);
    padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .meal-tbl .muted{font-size:12.5px;color:var(--text-3);font-style:italic}
  .meal-tbl td:nth-child(3)::before{content:"swap: ";color:var(--text-3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
  .meal-tbl td:nth-child(4),.meal-tbl td:nth-child(5){display:inline-block;width:48%;
    font-family:var(--mono);font-size:12px;padding-top:6px;border-top:1px dashed var(--line);margin-top:6px}
  .meal-tbl td:nth-child(4)::before{content:"kcal ";color:var(--text-3);font-size:10px}
  .meal-tbl td:nth-child(5)::before{content:"prot ";color:var(--text-3);font-size:10px}

  /* Today's session list — keep compact */
  .sess-row{grid-template-columns:24px 1fr auto auto;gap:8px;padding:8px 0;font-size:13px}
  .sess-rep{font-size:10.5px}
  .sess-prog{font-size:10.5px;min-width:28px}

  /* Plan day detail rows */
  .pd-row{gap:10px}
  .pd-name{font-size:14px}
  .pd-note{font-size:10.5px}

  /* Banners — tighter */
  .banner{padding:10px 12px;font-size:12.5px;gap:10px;flex-wrap:wrap}
  .banner-tag{font-size:8.5px;padding:2px 6px}

  /* Heatmap — bigger tap targets */
  .hm-cell{min-height:14px}
  .hm-wk{font-size:8px}

  /* PR list — stack week marker */
  .pr-row{grid-template-columns:1fr auto;gap:4px}
  .pr-when{grid-column:1/-1;text-align:left;font-size:10.5px;margin-top:-2px}

  /* Tweaks panel: stays compact, but bound it within viewport */
  .tweaks-panel,.tweaks{max-width:calc(100vw - 24px) !important;
    max-height:70vh !important;overflow:auto}

  /* Spotlight modal */
  .spot{width:100%;max-width:100%;border-radius:0;height:100vh;max-height:100vh}
  .spot-input{padding:12px 14px}
  .spot-item{padding:10px 12px}

  /* CRT scanlines slightly thinner so phone OLED doesn't moiré */
  .crt.sc::before{background-size:100% 2px;opacity:.55}
}

/* ============================================================
   FUN MECHANICS — form cues, specimens, telemetry, atlas, capsule
   ============================================================ */

/* Form cues button on exercise card */
.ex-cues{display:inline-block;margin:0 0 10px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;color:var(--warn);background:transparent;border:0;
  border-bottom:1px dashed var(--warn);padding:1px 0;cursor:pointer}
.ex-cues:hover{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:680px){
  .ex-cues{display:block;margin:6px 0 10px 0;font-size:12px}
  .ex-video{display:block;margin-bottom:6px}
}

/* ----- Form cues modal ----- */
.fcm-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:vmodFadeIn .15s ease-out;backdrop-filter:blur(4px)}
.fcm{width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;
  background:var(--bg);border:1px solid var(--warn);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 24px 64px rgba(0,0,0,.6),0 0 36px rgba(251,191,36,.18);
  font-family:var(--mono);overflow:auto;overscroll-behavior:contain}
.fcm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg-2);
  position:sticky;top:0;z-index:1}
.fcm-title{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.fcm-eyebrow{font-size:10px;letter-spacing:.18em;color:var(--warn);font-weight:600}
.fcm-name{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.fcm-close{font-family:var(--mono);font-size:16px;background:transparent;
  color:var(--text-3);border:1px solid var(--line-2);padding:6px 12px;cursor:pointer;
  min-width:44px;min-height:36px;line-height:1;flex-shrink:0}
.fcm-close:hover{color:var(--danger);border-color:var(--danger)}
.fcm-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.fcm-body section{display:flex;flex-direction:column;gap:8px}
.fcm-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--accent);
  font-weight:600;margin:0}
.fcm-h.danger{color:var(--danger)}
.fcm-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.fcm-list li{font-family:var(--sans);font-size:14px;line-height:1.55;color:var(--text);
  padding:8px 10px 8px 36px;background:var(--bg-2);border-left:2px solid var(--line);position:relative}
.fcm-list li::before{content:counter(item);counter-increment:item;position:absolute;left:10px;top:10px;
  font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:700}
.fcm-list{counter-reset:item}
.fcm-list.mistakes li::before{content:"✗";color:var(--danger)}
.fcm-list.mistakes li{border-left-color:var(--danger)}
.fcm-tip{padding:14px 16px;background:rgba(34,211,238,.06);border-left:3px solid var(--info);
  font-family:var(--sans);font-size:14px;color:var(--text);display:flex;gap:10px;flex-wrap:wrap;line-height:1.55}
.fcm-tip-tag{font-family:var(--mono);font-size:10.5px;color:var(--info);letter-spacing:.1em;
  font-weight:700;flex-shrink:0}
@media (max-width:600px){
  .fcm-bg{padding:0;align-items:stretch}
  .fcm{max-height:100vh;height:100%;border:0}
  .fcm-list li{font-size:14.5px}
}

/* ----- Telemetry toast (every set) ----- */
.tlm-toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:rgba(20,23,26,.95);backdrop-filter:blur(8px);
  border:1px solid var(--accent);padding:10px 16px;
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:13px;color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 16px rgba(163,230,53,.18);
  z-index:9990;max-width:calc(100vw - 28px);
  animation:tlmIn .25s cubic-bezier(.2,.7,.3,1)}
@keyframes tlmIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.tlm-tag{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:600;white-space:nowrap}
.tlm-msg{color:var(--text)}
@media (max-width:680px){.tlm-toast{font-size:12px;bottom:90px;padding:9px 14px}}

/* ----- Specimen card drop ----- */
.spec-drop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(440px,calc(100vw - 28px));z-index:9991;
  background:var(--bg);border:2px solid var(--accent);
  padding:18px;cursor:pointer;font-family:var(--mono);
  box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 40px rgba(163,230,53,.22);
  animation:specIn .4s cubic-bezier(.2,.7,.3,1)}
.spec-drop.rarity-uncommon{border-color:var(--info);box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 40px rgba(103,232,249,.25)}
.spec-drop.rarity-rare{border-color:#f472b6;box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 50px rgba(244,114,182,.35)}
@keyframes specIn{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.spec-drop-head{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.spec-rarity{font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:700}
.spec-drop.rarity-uncommon .spec-rarity{color:var(--info)}
.spec-drop.rarity-rare .spec-rarity{color:#f472b6}
.spec-x{font-size:10px;color:var(--text-3);letter-spacing:.06em}
.spec-drop-card{padding:14px 0}
.spec-cat{font-size:9.5px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
.spec-title{font-family:var(--sans);font-weight:700;font-size:18px;color:var(--text);
  letter-spacing:-.01em;margin:6px 0 10px;line-height:1.25}
.spec-body{font-family:var(--sans);font-size:13.5px;color:var(--text-2);line-height:1.55}
.spec-source{font-size:10.5px;color:var(--text-3);margin-top:10px;font-style:italic}
.spec-drop-foot{font-size:10px;color:var(--text-3);letter-spacing:.08em;
  padding-top:10px;border-top:1px solid var(--line)}

/* ----- Milestone toast (50/100/500/...) ----- */
.milestone{position:fixed;inset:0;z-index:9992;display:flex;
  align-items:center;justify-content:center;animation:vmodFadeIn .25s ease-out;cursor:pointer}
.milestone-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
.milestone-card{position:relative;background:var(--bg);border:2px solid var(--accent);
  padding:32px 40px;text-align:center;font-family:var(--mono);
  box-shadow:0 0 60px rgba(163,230,53,.4);
  animation:specIn .4s cubic-bezier(.2,.7,.3,1);max-width:calc(100vw - 28px)}
.milestone-num{font-family:var(--sans);font-weight:800;font-size:96px;line-height:1;
  color:var(--accent);text-shadow:0 0 24px rgba(163,230,53,.5)}
.milestone-label{font-size:11px;letter-spacing:.3em;color:var(--text-2);margin-top:6px}
.milestone-msg{font-family:var(--mono);font-size:13.5px;color:var(--text);
  margin-top:24px;line-height:1.55;max-width:380px}

/* ----- Phase transition cutscene ----- */
.phase-trans{position:fixed;inset:0;z-index:9993;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  font-family:var(--mono);color:var(--accent);padding:24px;
  animation:vmodFadeIn .5s ease-out}
.pt-art{font-size:12px;line-height:1.5;color:var(--accent);text-shadow:0 0 6px rgba(163,230,53,.3);margin:0;
  overflow-x:auto;max-width:100%;white-space:pre}
.pt-stats{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--text);font-family:var(--mono);
  min-width:280px;animation:fadeStat .3s}
@keyframes fadeStat{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.pt-row{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px dashed var(--line);
  animation:fadeStat .3s}
.pt-row span{color:var(--text-3)}
.pt-row b{color:var(--accent);font-weight:600;font-family:var(--mono)}
.pt-foot{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:12px}
.pt-msg{font-size:12px;color:var(--text-2)}
.pt-btn{font-family:var(--mono);font-size:13px;letter-spacing:.1em;
  background:var(--accent);color:#0a0e0a;border:0;padding:12px 24px;cursor:pointer;font-weight:700;
  min-height:44px}
.pt-btn:hover{background:#bef264}
@media(max-width:600px){.pt-art{font-size:9px}}

/* ----- Atlas view ----- */
.atlas{padding:0 0 18px}
.atlas-sub{color:var(--text-2);font-size:13.5px;line-height:1.55;max-width:640px;margin-bottom:18px;
  font-family:var(--sans)}
.atlas-stats{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:10px;
  background:var(--bg-2);border:1px solid var(--line);padding:14px;margin-bottom:14px}
@media(max-width:680px){.atlas-stats{grid-template-columns:repeat(2,1fr)}}
.as{display:flex;flex-direction:column;gap:4px}
.as-l{font-size:9.5px;letter-spacing:.14em;color:var(--text-3)}
.as-v{font-family:var(--sans);font-weight:700;font-size:28px;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums}
.as-v small{font-size:14px;color:var(--text-3);font-weight:400;margin-left:2px}
.as-p{height:4px;background:var(--bg-3);position:relative;overflow:hidden}
.as-p span{position:absolute;inset:0;background:var(--accent);transition:width .3s}
.atlas-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.af-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line);color:var(--text-2);padding:6px 12px;cursor:pointer}
.af-btn.on{background:var(--accent);color:#0a0e0a;border-color:var(--accent);font-weight:600}
.af-btn:hover:not(.on){border-color:var(--text-3);color:var(--text)}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ac{position:relative;background:var(--bg-2);border:1px solid var(--line);padding:12px;
  cursor:pointer;text-align:left;font-family:var(--mono);transition:all .15s;
  display:flex;flex-direction:column;gap:6px;min-height:140px}
.ac:hover.owned{border-color:var(--accent)}
.ac.locked{opacity:.48;cursor:default}
.ac.open{grid-column:1/-1;background:var(--bg-3);border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),0 8px 24px rgba(0,0,0,.4)}
.ac.rarity-uncommon.owned{border-left:3px solid var(--info)}
.ac.rarity-rare.owned{border-left:3px solid #f472b6}
.ac-head{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;
  letter-spacing:.1em;color:var(--text-3)}
.ac-rarity{color:var(--accent)}
.ac.rarity-uncommon .ac-rarity{color:var(--info)}
.ac.rarity-rare .ac-rarity{color:#f472b6}
.ac-cat{font-size:9.5px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
.ac-title{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--text);line-height:1.3}
.ac-body{font-family:var(--sans);font-size:13px;color:var(--text-2);line-height:1.55;margin-top:6px}
.ac-source{font-size:10.5px;color:var(--text-3);font-style:italic;margin-top:6px}
.ac-locked{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:6px;
  color:var(--text-3)}
.ac-lock-icon{font-size:22px}
.ac-lock-msg{font-size:10px;letter-spacing:.14em}

/* ----- Time capsule (on Today) ----- */
.capsule{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid #f472b6;
  padding:16px 18px;font-family:var(--mono)}
.capsule-eyebrow{font-size:10px;letter-spacing:.14em;color:#f472b6;font-weight:600}
.capsule-h{font-family:var(--sans);font-weight:600;font-size:16px;color:var(--text);
  letter-spacing:-.01em;margin-top:3px}
.capsule-p{font-family:var(--sans);font-size:13px;color:var(--text-2);line-height:1.55;margin:10px 0 0}
.capsule-p.sealed{color:#f472b6;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em}
.capsule-area{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);
  color:var(--text);font-family:var(--mono);font-size:13px;padding:10px;margin-top:10px;resize:vertical;outline:none}
.capsule-area:focus{border-color:#f472b6}
.capsule-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.capsule-count{font-size:10.5px;color:var(--text-3)}
.capsule-btn{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
  background:transparent;border:1px solid #f472b6;color:#f472b6;padding:8px 16px;cursor:pointer;font-weight:600}
.capsule-btn:hover:not(:disabled){background:#f472b6;color:#0a0e0a}
.capsule-btn:disabled{opacity:.4;cursor:not-allowed}
.capsule-btn.big{padding:14px 24px;font-size:13px;margin-top:14px}
.capsule-text{font-family:var(--mono);font-size:13px;color:var(--text);
  background:var(--bg);padding:14px;margin-top:10px;white-space:pre-wrap;border:1px solid var(--line)}
.capsule-locked{font-family:var(--mono);font-size:11px;color:var(--text-3);
  text-align:center;letter-spacing:.2em;padding:14px;background:var(--bg);margin-top:10px;line-height:2}

/* ----- Konami overlay ----- */
.konami{position:fixed;inset:0;z-index:9994;background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);cursor:pointer;
  animation:vmodFadeIn .2s ease-out}
.konami-art{font-family:var(--mono);font-size:13px;color:var(--accent);text-shadow:0 0 8px var(--accent);
  line-height:1.5;margin:0;text-align:center;padding:20px}
@media (max-width:600px){.konami-art{font-size:11px}}

/* Keyboard inset — when on-screen keyboard appears, push fixed-position chrome above it.
   Set --kb-h on body via visualViewport listener (in console-app.jsx). */
body{--kb-h:0px}
@media (max-width:820px){
  .nav{bottom:calc(0px + var(--kb-h, 0px));transition:bottom .12s}
  main{padding-bottom:calc(90px + var(--kb-h, 0px)) !important}
}
.tlm-toast{bottom:calc(80px + var(--kb-h, 0px));transition:bottom .12s}
.twk-panel{bottom:calc(16px + var(--kb-h, 0px)) !important;transition:bottom .12s}

/* Bonus set row styling */
.set-row.bonus{border:1px dashed var(--accent);background:rgba(163,230,53,.04)}
.set-row.bonus .set-n{color:var(--accent)}
.set-bonus-tag{display:inline-block;margin-right:5px;color:var(--accent);font-weight:700}

/* Bonus-set add button + custom exercise UI */
