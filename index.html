.ex-bonus{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  padding:7px 12px;background:transparent;border:1px dashed var(--accent);color:var(--accent);
  cursor:pointer;margin-left:8px}
.ex-bonus:hover{background:rgba(163,230,53,.08)}
.ex-remove{font:inherit;font-family:var(--mono);font-size:11px;background:transparent;
  border:1px solid var(--line-2);color:var(--text-3);padding:7px 12px;cursor:pointer;margin-left:8px}
.ex-remove:hover{border-color:var(--danger);color:var(--danger)}
.ex-card.custom{border-left:3px solid var(--accent);background:rgba(163,230,53,.02)}
.ex-card.custom .ex-num{color:var(--accent);font-weight:700;font-size:14px}
.ex-custom-tag{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.12em;font-weight:600}

.add-custom-trigger{display:block;width:100%;font:inherit;font-family:var(--mono);font-size:13px;
  background:transparent;border:1px dashed var(--line-2);color:var(--text-2);padding:14px;
  cursor:pointer;margin:14px 0;letter-spacing:.04em}
.add-custom-trigger:hover{border-color:var(--accent);color:var(--accent)}
.add-custom{background:var(--bg-2);border:1px solid var(--accent);padding:14px;margin:14px 0;
  font-family:var(--mono)}
.add-custom-head{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:600;margin-bottom:10px}
.add-custom-form{display:flex;flex-direction:column;gap:8px}
.add-custom-form input{font-family:var(--mono);font-size:14px;padding:10px;background:var(--bg);
  border:1px solid var(--line-2);color:var(--text);outline:none;width:100%}
.add-custom-form input:focus{border-color:var(--accent)}
.add-custom-row{display:flex;gap:10px}
.add-custom-row label{flex:1;font-size:10.5px;color:var(--text-3);letter-spacing:.08em;
  display:flex;flex-direction:column;gap:4px}
.add-custom-row label input{width:100%}
.add-custom-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.add-custom-actions button{font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  padding:9px 16px;background:var(--accent);color:#0a0e0a;border:0;cursor:pointer;font-weight:600;min-height:44px}
.add-custom-actions button.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text-2)}

/* Coach-tone telemetry */
.tlm-toast.coach{border-color:var(--info);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 16px rgba(103,232,249,.22)}
.tlm-toast.coach .tlm-tag{color:var(--info)}

/* ============================================================
   Improvements batch — import, error boundary, PWA toast, undo,
   capsule collapsed, atlas lock hint, mobile spotlight tap target
   ============================================================ */

/* Mobile spotlight tap on the ⌘K hint */
.kbd-hint{cursor:pointer;user-select:none;transition:all .12s}
.kbd-hint:hover,.kbd-hint:active{background:rgba(163,230,53,.1);color:var(--accent);border-color:var(--accent)}
@media (max-width:680px){
  .kbd-hint{display:inline-block;padding:6px 10px;font-size:11.5px;min-height:32px}
}

/* Import block in Export view */
.import-block{margin-top:24px;background:var(--bg-2);border:1px solid var(--line);
  border-left:3px solid var(--warn);padding:18px 20px;font-family:var(--mono)}
.import-head{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.import-head .card-eyebrow{color:var(--warn)}
.import-note{font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--text-2);margin:0 0 10px}
.import-area{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);
  color:var(--text);font-family:var(--mono);font-size:12px;padding:10px;outline:none;resize:vertical}
.import-area:focus{border-color:var(--warn)}
.import-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.import-file-btn{font:inherit;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  background:transparent;border:1px solid var(--line-2);color:var(--text-2);padding:9px 14px;
  cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.import-file-btn:hover{border-color:var(--warn);color:var(--warn)}
.import-file-btn input{display:none}
.import-btn{font:inherit;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
  background:var(--warn);color:#0a0e0a;border:0;padding:9px 18px;cursor:pointer;font-weight:700;
  min-height:44px;margin-left:auto}
.import-btn:disabled{opacity:.4;cursor:not-allowed}
.import-status{margin-top:10px;padding:8px 12px;font-family:var(--mono);font-size:12px}
.import-status.ok{color:var(--accent);background:rgba(163,230,53,.06);border-left:2px solid var(--accent)}
.import-status.err{color:var(--danger);background:rgba(248,113,113,.06);border-left:2px solid var(--danger)}

/* Error boundary */
.err-boundary{padding:36px 24px;background:var(--bg-2);border:1px solid var(--danger);
  font-family:var(--mono);color:var(--text);text-align:center;max-width:600px;margin:60px auto}
.err-tag{font-size:10px;letter-spacing:.18em;color:var(--danger);font-weight:700}
.err-boundary h3{font-family:var(--sans);font-size:22px;font-weight:700;margin:8px 0 18px;
  letter-spacing:-.01em}
.err-msg{background:var(--bg);padding:12px;border:1px solid var(--line);text-align:left;
  font-size:12px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.err-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.err-actions button{font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  background:var(--accent);color:#0a0e0a;border:0;padding:10px 18px;cursor:pointer;font-weight:700;
  min-height:44px}
.err-actions button.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text)}
.err-help{font-size:10.5px;color:var(--text-3);margin-top:18px}

/* PWA update toast */
.pwa-toast{position:fixed;left:50%;top:calc(46px + env(safe-area-inset-top));
  transform:translateX(-50%);z-index:9988;
  background:rgba(20,23,26,.96);backdrop-filter:blur(8px);border:1px solid var(--info);
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 16px rgba(103,232,249,.18);
  max-width:calc(100vw - 28px)}
.pwa-tag{font-size:10px;letter-spacing:.14em;color:var(--info);font-weight:600;white-space:nowrap}
.pwa-msg{color:var(--text-2);flex:1}
.pwa-reload{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  background:var(--info);color:#0a0e0a;border:0;padding:6px 12px;cursor:pointer;font-weight:700;min-height:32px}
.pwa-dismiss{font:inherit;font-family:var(--mono);background:transparent;border:0;color:var(--text-3);
  cursor:pointer;padding:2px 6px;font-size:12px}
.pwa-dismiss:hover{color:var(--text)}

/* Undo toast — sits below telemetry stack */
.undo-toast{position:fixed;left:50%;bottom:calc(140px + var(--kb-h, 0px));transform:translateX(-50%);z-index:9990;
  background:rgba(20,23,26,.96);backdrop-filter:blur(8px);border:1px solid var(--warn);
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100vw - 28px);
  animation:tlmIn .25s cubic-bezier(.2,.7,.3,1)}
.undo-tag{font-size:10px;letter-spacing:.14em;color:var(--warn);font-weight:600;white-space:nowrap}
.undo-msg{flex:1;color:var(--text-2)}
.undo-btn{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  background:var(--warn);color:#0a0e0a;border:0;padding:6px 12px;cursor:pointer;font-weight:700;min-height:32px}

/* Time capsule — collapsed inline banner */
.capsule.capsule-collapsed{display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:10px 14px;background:transparent;border:1px dashed #f472b6;border-left:3px solid #f472b6;
  width:100%;text-align:left;font:inherit}
.capsule.capsule-collapsed:hover{background:rgba(244,114,182,.05)}
.capsule.capsule-collapsed .capsule-eyebrow{color:#f472b6;font-size:10px}
.capsule-mini{font-family:var(--mono);font-size:11.5px;color:var(--text-2);flex:1}
.capsule-expand{font-family:var(--mono);font-size:10.5px;color:#f472b6;letter-spacing:.06em}
.capsule-collapse-btn{font:inherit;font-family:var(--mono);font-size:10.5px;background:transparent;
  border:0;color:var(--text-3);cursor:pointer;letter-spacing:.06em;margin-top:8px;padding:4px}
.capsule-collapse-btn:hover{color:#f472b6}

/* Atlas locked hint */
.ac-lock-hint{font-size:9.5px;color:var(--text-3);letter-spacing:.14em;text-transform:uppercase;
  text-align:center;margin-top:2px;opacity:.7}

/* TOUCH targets — extended set */
@media (hover:none){
  button,.set-go,.day-tab,.ds-btn,.phase-btn,.nav-btn,.vmod-mode-btn,.vmod-link-btn,.todaybtn,.ex-mark,.meal-tick,.meal-skip,.qwl button,.pu-step,.af-btn,.fcm-close,.capsule-btn,.ex-cues,.ex-bonus,.ex-remove,.add-custom-trigger,.kbd-hint,.import-file-btn,.import-btn,.pwa-reload,.undo-btn{min-height:44px}
  .meal-tick{min-width:44px}
}
</style>
</head>
