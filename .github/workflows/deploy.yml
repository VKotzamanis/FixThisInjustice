# Publishes dist/ only from a successful CI run on main.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VITE_REMINDER_API: ${{ vars.VITE_REMINDER_API }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: No personal health data in the tracked tree
        run: |
          set -euo pipefail
          # P7 widened this from 'src/ worker/ public/ index.html' to the whole tracked tree. Four
          # paths are exempt, each for a stated reason: docs/review/ and docs/plans/ are the
          # documents that decided the terms had to go and quote them to say so, REFERENCES.md logs
          # the Crossref queries that sourced the content review, and graphify-out/ is a generated
          # index of all three.
          # One-character classes keep the pattern from matching its own definition. git grep exits 1
          # on no match, which is the passing case, and also when a pathspec matches no tracked file.
          # \b is load-bearing. Unanchored and case-insensitive, the location identifier matched the
          # same letters inside a base64 data URI in src/skins/limelight/icons.ts (commit 8511f21),
          # so the job failed on generated data rather than on prose. Measured 2026-09-02 against the
          # widened pathspec: \b alone clears that false positive, so the two generated asset modules
          # that used to be excluded are now covered by the gate.
          if ! git grep -nEi '\b(vyvans[e]|lisdexamfetamin[e]|ymc[a]|amphetamin[e])\b' -- . ':!docs/review/' ':!docs/plans/' ':!REFERENCES.md' ':!graphify-out/'; then
            echo "PASS: no medication or location identifier outside the four exempt paths"
          else
            echo "FAIL: personal health data found in the tracked tree"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
